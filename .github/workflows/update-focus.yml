name: Update Latest Focus

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Activity & Update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'MGAceret';
            
            try {
              let targetRepo = null;
              let commitMsg = 'Recent code updates';
              let activityDate = null;

              // 1. Fetch user's public event stream (includes organizational and personal pushes)
              try {
                const { data: events } = await github.rest.activity.listPublicEventsForUser({
                  username,
                  per_page: 30
                });

                const pushEvent = events.find(e =>
                  e.type === 'PushEvent' &&
                  e.repo &&
                  e.repo.name.toLowerCase() !== `${username}/${username}`.toLowerCase()
                );

                if (pushEvent) {
                  const [owner, repo] = pushEvent.repo.name.split('/');
                  const { data: repoDetails } = await github.rest.repos.get({ owner, repo });

                  targetRepo = repoDetails;
                  activityDate = new Date(pushEvent.created_at);

                  if (pushEvent.payload && pushEvent.payload.commits && pushEvent.payload.commits.length > 0) {
                    const lastCommit = pushEvent.payload.commits[pushEvent.payload.commits.length - 1];
                    commitMsg = lastCommit.message.split('\n')[0];
                  }
                }
              } catch (err) {
                console.log('Public events check skipped or failed:', err.message);
              }

              // 2. Fallback: Check personal public repositories if no recent push event was found
              if (!targetRepo) {
                const { data: repos } = await github.rest.repos.listForUser({
                  username,
                  sort: 'pushed',
                  direction: 'desc',
                  per_page: 10
                });

                targetRepo = repos.find(r => r.name.toLowerCase() !== username.toLowerCase() && !r.fork) || repos[0];

                if (targetRepo) {
                  activityDate = new Date(targetRepo.pushed_at);
                  try {
                    const { data: commits } = await github.rest.repos.listCommits({
                      owner: targetRepo.owner.login,
                      repo: targetRepo.name,
                      per_page: 1
                    });
                    if (commits.length > 0) {
                      commitMsg = commits[0].commit.message.split('\n')[0];
                    }
                  } catch (err) {
                    console.log('Could not fetch commit details, using default message');
                  }
                }
              }

              if (!targetRepo) {
                console.log('No active repositories found.');
                return;
              }

              // 3. Format relative time
              const now = new Date();
              const diffHours = Math.round((now - activityDate) / (1000 * 60 * 60));
              let timeStr = `${diffHours} hour${diffHours === 1 ? '' : 's'} ago`;
              if (diffHours >= 24) {
                const diffDays = Math.round(diffHours / 24);
                timeStr = `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
              } else if (diffHours <= 0) {
                timeStr = 'recently';
              }

              const languageTag = targetRepo.language ? `\`${targetRepo.language}\`` : '`Code`';
              const repoDesc = targetRepo.description ? ` — *${targetRepo.description}*` : '';

              const newContent = [
                '<!-- RECENT_ACTIVITY_START -->',
                `- 🚀 **[${targetRepo.name}](${targetRepo.html_url})**${repoDesc} *(Active ${timeStr})*  `,
                `  > 📝 *Latest Commit:* "${commitMsg}"  `,
                `  > 🛠️ **Primary Tech:** ${languageTag}  `,
                '<!-- RECENT_ACTIVITY_END -->'
              ].join('\n');

              // 4. Update README.md
              const readmePath = 'README.md';
              let readme = fs.readFileSync(readmePath, 'utf8');

              const regex = /<!-- RECENT_ACTIVITY_START -->[\s\S]*?<!-- RECENT_ACTIVITY_END -->/;
              if (regex.test(readme)) {
                readme = readme.replace(regex, newContent);
                fs.writeFileSync(readmePath, readme);
                console.log(`Successfully updated README with latest focus: ${targetRepo.full_name || targetRepo.name}!`);
              } else {
                console.log('Could not find RECENT_ACTIVITY tags in README.md');
              }
            } catch (error) {
              core.setFailed(`Action failed with error: ${error.message}`);
            }

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): auto-update current focus activity [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

name: Update Latest Focus

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Activity & Update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'MGAceret';
            
            try {
              // 1. Fetch user's public repositories sorted by latest push
              const { data: repos } = await github.rest.repos.listForUser({
                username,
                sort: 'pushed',
                direction: 'desc',
                per_page: 10
              });

              // Filter out the profile repo itself and any forks to find latest original work
              const activeRepo = repos.find(r => r.name.toLowerCase() !== username.toLowerCase() && !r.fork) || repos[0];

              if (!activeRepo) {
                console.log('No active repositories found.');
                return;
              }

              // 2. Fetch the latest commit for this repository
              let commitMsg = activeRepo.description || 'Recent code updates';
              try {
                const { data: commits } = await github.rest.repos.listCommits({
                  owner: username,
                  repo: activeRepo.name,
                  per_page: 1
                });
                if (commits.length > 0) {
                  commitMsg = commits[0].commit.message.split('\n')[0];
                }
              } catch (err) {
                console.log('Could not fetch commit details, fallback to description');
              }

              // 3. Format relative time
              const updatedAt = new Date(activeRepo.pushed_at);
              const now = new Date();
              const diffHours = Math.round((now - updatedAt) / (1000 * 60 * 60));
              let timeStr = `${diffHours} hour${diffHours === 1 ? '' : 's'} ago`;
              if (diffHours >= 24) {
                const diffDays = Math.round(diffHours / 24);
                timeStr = `${diffDays} day${diffDays === 1 ? '' : 's'} ago`;
              }

              const languageTag = activeRepo.language ? `\`${activeRepo.language}\`` : '`Code`';
              const repoDesc = activeRepo.description ? ` — *${activeRepo.description}*` : '';

              const newContent = [
                '<!-- RECENT_ACTIVITY_START -->',
                `- 🚀 **[${activeRepo.name}](${activeRepo.html_url})**${repoDesc} *(Active ${timeStr})*  `,
                `  > 📝 *Latest Commit:* "${commitMsg}"  `,
                `  > 🛠️ **Primary Tech:** ${languageTag}  `,
                '<!-- RECENT_ACTIVITY_END -->'
              ].join('\n');

              // 4. Update README.md
              const readmePath = 'README.md';
              let readme = fs.readFileSync(readmePath, 'utf8');

              const regex = /<!-- RECENT_ACTIVITY_START -->[\s\S]*?<!-- RECENT_ACTIVITY_END -->/;
              if (regex.test(readme)) {
                readme = readme.replace(regex, newContent);
                fs.writeFileSync(readmePath, readme);
                console.log('Successfully updated README with latest focus!');
              } else {
                console.log('Could not find RECENT_ACTIVITY tags in README.md');
              }
            } catch (error) {
              core.setFailed(`Action failed with error: ${error.message}`);
            }

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): auto-update current focus activity [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
